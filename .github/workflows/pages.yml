name: Publish CT128 GPU LAB dashboard
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public CEB fixtures
        run: |
          python -m pip install reportlab==4.4.9 PyMuPDF==1.26.7
          python scripts/ceb-public-inputs.py
          python scripts/ceb-build-portable.py
          # Frozen package: a page edit must not change the bytes on Google Drive.
          git fetch --no-tags origin abed5ba85ef94ffce6ed49219669f5548af1da78
          git show FETCH_HEAD:CEB-3.0-inputs.zip > docs/ceb/v3/CEB-3.0-inputs.zip
          printf '%s  %s\n' '176bc4336fbcefa15e700df49dffe778202efa0548045dc74dda1f000e16a1db' 'CEB-3.0-inputs.zip' > docs/ceb/v3/sha256.txt
          (cd docs/ceb/v3 && sha256sum -c sha256.txt)
          python -c "import zipfile,pathlib; z=zipfile.ZipFile('docs/ceb/v3/CEB-3.0-inputs.zip'); assert all(z.read(n)==pathlib.Path('docs/ceb/v3',n).read_bytes() for n in ['manifest.json','extension-tasks.json','run-template.json'])"
      - name: Build unified engineering input package
        run: python scripts/ceb-build-engineering.py
      - name: Verify public Yandex Disk mirror (non-blocking)
        run: python scripts/ceb-check-yandex.py
      - name: Build resilient launch prompt (fixed archive and embedded tasks)
        run: python scripts/ceb-build-start.py
      - name: Verify active CEB navigation and prompt
        run: python scripts/ceb-check-active.py
      - name: Verify preflight negative case
        run: |
          python scripts/ceb-prepare.py --pack docs/ceb/inputs/CEB-offline-inputs.zip --sources /tmp/ceb-empty-sources --output /tmp/ceb-preflight
          set +e
          python scripts/ceb-prepare.py --pack docs/ceb/inputs/CEB-offline-inputs.zip --sources /tmp/ceb-empty-sources --output /tmp/ceb-preflight-strict --strict
          code=$?
          set -e
          test "$code" = 2
      - name: Publish raw backup of public inputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch origin refs/heads/ceb-inputs:refs/remotes/origin/ceb-inputs; then
            git worktree add --detach /tmp/ceb-raw origin/ceb-inputs
          else
            git worktree add --detach /tmp/ceb-raw HEAD
            git -C /tmp/ceb-raw switch --orphan ceb-inputs
          fi
          cp docs/ceb/inputs/CEB-offline-inputs.zip docs/ceb/inputs/portable-sha256.txt docs/ceb/v3/CEB-3.0-inputs.zip /tmp/ceb-raw/
          cp docs/ceb/v3/sha256.txt /tmp/ceb-raw/CEB-3.0-sha256.txt
          SHA=$(cut -d' ' -f1 docs/ceb/v3/engineering-sha256.txt)
          TARGET="/tmp/ceb-raw/engineering/$SHA"
          mkdir -p "$TARGET/files"
          cp docs/ceb/v3/engineering-inputs.zip docs/ceb/v3/engineering-sha256.txt "$TARGET/"
          python -c 'import zipfile,sys; zipfile.ZipFile("docs/ceb/v3/engineering-inputs.zip").extractall(sys.argv[1])' "$TARGET/files"
          git -C /tmp/ceb-raw add CEB-offline-inputs.zip portable-sha256.txt CEB-3.0-inputs.zip CEB-3.0-sha256.txt "engineering/$SHA"

          if ! git -C /tmp/ceb-raw diff --cached --quiet; then
            git -C /tmp/ceb-raw commit -m 'Publish public CEB offline input pack'
            git -C /tmp/ceb-raw push origin HEAD:refs/heads/ceb-inputs
          fi
      - uses: actions/upload-artifact@v7
        with:
          path: docs/ceb/v3/CEB-3.0-inputs.zip
          archive: false
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          path: docs/ceb/v3/engineering-inputs.zip
          archive: false
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
