name: Publish CT128 GPU LAB dashboard
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public CEB fixtures
        run: |
          python -m pip install reportlab==4.4.9 PyMuPDF==1.26.7
          python scripts/ceb-public-inputs.py
          python scripts/ceb-build-portable.py
      - name: Verify preflight negative case
        run: |
          python scripts/ceb-prepare.py --pack docs/ceb/inputs/CEB-offline-inputs.zip --sources /tmp/ceb-empty-sources --output /tmp/ceb-preflight
          set +e
          python scripts/ceb-prepare.py --pack docs/ceb/inputs/CEB-offline-inputs.zip --sources /tmp/ceb-empty-sources --output /tmp/ceb-preflight-strict --strict
          code=$?
          set -e
          test "$code" = 2
      - name: Publish raw backup of public inputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch origin refs/heads/ceb-inputs:refs/remotes/origin/ceb-inputs; then
            git worktree add --detach /tmp/ceb-raw origin/ceb-inputs
          else
            git worktree add --detach /tmp/ceb-raw HEAD
            git -C /tmp/ceb-raw switch --orphan ceb-inputs
          fi
          cp docs/ceb/inputs/CEB-offline-inputs.zip docs/ceb/inputs/portable-sha256.txt /tmp/ceb-raw/
          git -C /tmp/ceb-raw add CEB-offline-inputs.zip portable-sha256.txt
          if ! git -C /tmp/ceb-raw diff --cached --quiet; then
            git -C /tmp/ceb-raw commit -m 'Publish public CEB offline input pack'
            git -C /tmp/ceb-raw push origin HEAD:refs/heads/ceb-inputs
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
